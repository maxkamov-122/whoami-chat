<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WHOAMI SEC</title>
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}

body{
  background:#080b14;
  color:#e2e8f0;
  display:flex;flex-direction:column;height:100vh;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 15%,rgba(99,102,241,.18) 0%,transparent 60%),
    radial-gradient(ellipse 50% 60% at 85% 85%,rgba(139,92,246,.14) 0%,transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 0%,rgba(56,189,248,.08) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}

/* GLASS */
.g1{background:rgba(255,255,255,.06);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.13)}
.g2{background:rgba(255,255,255,.04);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08)}

/* SCREENS */
.scr{display:none;position:fixed;inset:0;z-index:200;justify-content:center;align-items:center;padding:16px}
.scr.on{display:flex}

/* LOGIN */
#ls{background:linear-gradient(160deg,#08091a,#0c1225,#080b14)}
.lcard{
  width:100%;max-width:400px;padding:36px 30px 28px;border-radius:28px;position:relative;z-index:1;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 40px 100px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12);
}
.lcard::before{
  content:'';position:absolute;inset:-1px;border-radius:29px;
  background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(99,102,241,.15),transparent 60%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;pointer-events:none;
}

.logo-wrap{text-align:center;margin-bottom:28px}
.logo-icon{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  box-shadow:0 8px 24px rgba(124,58,237,.4)}
.logo-title{font-size:22px;font-weight:800;letter-spacing:4px;
  background:linear-gradient(135deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:5px;margin-top:4px}

.av-wrap{margin-bottom:20px}
.av-label{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:2px;text-align:center;margin-bottom:10px}
.av-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.av-item{
  width:46px;height:46px;border-radius:14px;cursor:pointer;font-size:22px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.07);border:2px solid transparent;transition:all .2s;
}
.av-item:hover{background:rgba(255,255,255,.12);transform:scale(1.1)}
.av-item.sel{border-color:#a78bfa;background:rgba(167,139,250,.15);box-shadow:0 0 16px rgba(167,139,250,.3);transform:scale(1.08)}

.fi{position:relative;margin-bottom:10px}
.fi input,.fi textarea{
  width:100%;padding:12px 14px;border-radius:12px;outline:none;font-size:14px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:#fff;
  transition:all .2s;font-family:inherit;
}
.fi input::placeholder{color:rgba(255,255,255,.25)}
.fi input:focus{background:rgba(255,255,255,.11);border-color:rgba(167,139,250,.55);box-shadow:0 0 0 3px rgba(167,139,250,.12)}
.fi-ico{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.35;pointer-events:none}
#pass-hint{font-size:11px;color:rgba(167,139,250,.6);margin:-4px 0 8px 4px;display:none;letter-spacing:.5px}

.btn-go{
  width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(135deg,#7c3aed 0%,#4f46e5 100%);color:#fff;margin-top:4px;
  transition:all .2s;box-shadow:0 6px 24px rgba(124,58,237,.45);position:relative;overflow:hidden;
}
.btn-go::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.1),transparent);pointer-events:none}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(124,58,237,.55)}
.btn-go:active{transform:translateY(0);box-shadow:0 4px 16px rgba(124,58,237,.35)}
.lerr{color:#f87171;font-size:12px;text-align:center;margin-top:8px;min-height:16px}

/* APP */
#app{display:none;flex-direction:column;height:100%;position:relative;z-index:1}
#app.on{display:flex}

/* TOPBAR */
.tbar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0;
  background:rgba(5,7,18,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:10;
}
.tbar-logo{font-size:15px;font-weight:800;letter-spacing:3px;
  background:linear-gradient(135deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.online-badge{
  display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;
  background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:#4ade80;
}
.odot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tbar-r{margin-left:auto;display:flex;gap:6px;align-items:center}
.tbb{
  padding:5px 12px;border-radius:9px;font-size:12px;cursor:pointer;border:none;
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.65);transition:all .2s;font-weight:600;
}
.tbb:hover{background:rgba(255,255,255,.13);color:#fff}
.tbb-adm{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.tbb-adm:hover{background:rgba(239,68,68,.22)}
.tbb-hlp{background:rgba(56,189,248,.12);color:#7dd3fc;border:1px solid rgba(56,189,248,.2)}
.tbb-hlp:hover{background:rgba(56,189,248,.22)}

/* ANNOUNCE */
#ann{
  display:none;padding:7px 14px;font-size:12px;text-align:center;flex-shrink:0;
  background:rgba(251,191,36,.1);border-bottom:1px solid rgba(251,191,36,.2);color:#fde68a;
}
#ann.on{display:block}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sb{
  width:230px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;
  background:rgba(0,0,0,.25);border-right:1px solid rgba(255,255,255,.07);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#sb.off{display:none}

.sb-sec{padding:12px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.sb-ttl{font-size:10px;letter-spacing:2.5px;color:rgba(255,255,255,.25);text-transform:uppercase;margin-bottom:8px}
.uitem{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:11px;margin-bottom:2px;
  cursor:pointer;transition:all .15s;
}
.uitem:hover{background:rgba(255,255,255,.07)}
.uitem.no-dm{cursor:default}
.uitem.no-dm:hover{background:transparent}
.uav{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:rgba(255,255,255,.08)}
.uname{font-size:13px;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.utag{font-size:9px;padding:2px 6px;border-radius:5px;margin-left:auto;flex-shrink:0;font-weight:700;letter-spacing:.5px}
.ta{background:rgba(239,68,68,.18);color:#fca5a5}
.th{background:rgba(56,189,248,.18);color:#7dd3fc}
.tu{background:rgba(255,255,255,.08);color:rgba(255,255,255,.35)}
.dm-hint{font-size:10px;color:rgba(167,139,250,.5);margin-left:auto;display:none}
.uitem:hover .dm-hint{display:block}

.sb-sec2{padding:10px 12px;flex:1;overflow-y:auto}
.sbtn{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:10px;border:none;cursor:pointer;
  font-size:12px;text-align:left;margin-bottom:3px;transition:all .15s;background:transparent;color:rgba(255,255,255,.5);
  font-family:inherit;
}
.sbtn:hover{background:rgba(255,255,255,.08);color:#fff}

/* CHAT */
.cwrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* DM */
#dmov{
  display:none;position:absolute;inset:0;z-index:30;flex-direction:column;
  background:rgba(8,11,20,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
#dmov.on{display:flex}
.dm-tb{
  display:flex;align-items:center;gap:10px;padding:10px 14px;flex-shrink:0;
  background:rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.08);
}
.dm-info{flex:1}
.dm-info h3{font-size:14px;font-weight:700;color:#fff}
.dm-info p{font-size:11px;color:rgba(255,255,255,.35)}
.dm-close{padding:5px 12px;border-radius:9px;border:none;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);font-size:12px;font-family:inherit}
.dm-close:hover{background:rgba(255,255,255,.14);color:#fff}
#dmmsgs{flex:1;overflow-y:auto;padding:12px 14px}
#dmmsgs::-webkit-scrollbar{width:3px}
#dmmsgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}

/* MESSAGES */
#msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;scroll-behavior:smooth}
#msgs::-webkit-scrollbar{width:4px}
#msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

.msg{display:flex;gap:10px;margin-bottom:16px;animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.mav{width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,.08);align-self:flex-start;margin-top:1px;position:relative}
.mav .role-dot{position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;border-radius:50%;border:2px solid #080b14}
.rd-adm{background:#f87171}
.rd-hlp{background:#38bdf8}
.rd-usr{background:#a78bfa}

.mbody{flex:1;min-width:0}
.mhead{display:flex;align-items:center;gap:7px;margin-bottom:4px;flex-wrap:wrap}
.mnick{font-size:13px;font-weight:700}
.na{color:#f87171}
.nh{color:#38bdf8}
.nu{color:#a78bfa}

.mbadge{
  font-size:10px;padding:2px 8px;border-radius:6px;font-weight:700;letter-spacing:.5px;
}
.ba{background:linear-gradient(135deg,rgba(239,68,68,.25),rgba(220,38,38,.2));color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.bh{background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(14,165,233,.15));color:#7dd3fc;border:1px solid rgba(56,189,248,.2)}

.admin-title{
  font-size:9px;letter-spacing:2px;color:#fca5a5;background:rgba(239,68,68,.1);
  padding:1px 6px;border-radius:4px;border:1px solid rgba(239,68,68,.15);
}

.mtime{font-size:11px;color:rgba(255,255,255,.2);margin-left:auto}
.mtext{
  font-size:14px;line-height:1.6;color:rgba(255,255,255,.88);word-break:break-word;
  background:rgba(255,255,255,.05);padding:9px 13px;border-radius:4px 14px 14px 14px;
  border:1px solid rgba(255,255,255,.08);display:inline-block;max-width:85%;
}
.mtext.is-adm{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.15)}
.mtext.is-hlp{background:rgba(56,189,248,.07);border-color:rgba(56,189,248,.12)}

.msg.own{flex-direction:row-reverse}
.msg.own .mhead{flex-direction:row-reverse}
.msg.own .mtime{margin-left:0;margin-right:auto}
.msg.own .mtext{background:rgba(124,58,237,.22);border-color:rgba(124,58,237,.3);border-radius:14px 4px 14px 14px;color:#e0d9ff}
.msg.own .mbadge,.msg.own .admin-title{display:none}

.syslog{text-align:center;font-size:11px;color:rgba(255,255,255,.2);margin:4px 0 10px;padding:5px 12px;position:relative}
.syslog::before,.syslog::after{content:'';position:absolute;top:50%;width:calc(50% - 80px);height:1px;background:rgba(255,255,255,.06)}
.syslog::before{left:0}.syslog::after{right:0}
.sl-j{color:rgba(74,222,128,.45)}
.sl-l{color:rgba(248,113,113,.35)}
.sl-w{color:rgba(251,191,36,.4)}

#tybar{font-size:11px;color:rgba(255,255,255,.28);padding:2px 14px;min-height:18px;flex-shrink:0}

/* INPUT */
.ibar{
  display:flex;align-items:flex-end;gap:8px;padding:10px 12px;flex-shrink:0;
  background:rgba(5,7,18,.5);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.07);
}
.itxt{
  flex:1;padding:10px 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.1);outline:none;
  background:rgba(255,255,255,.07);color:#fff;font-size:14px;resize:none;min-height:44px;max-height:110px;
  font-family:inherit;line-height:1.45;transition:all .2s;
}
.itxt::placeholder{color:rgba(255,255,255,.22)}
.itxt:focus{border-color:rgba(167,139,250,.45);background:rgba(255,255,255,.09)}
.sbtn-send{
  width:44px;height:44px;border-radius:13px;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
  box-shadow:0 4px 16px rgba(124,58,237,.35);
}
.sbtn-send:hover{transform:scale(1.06);box-shadow:0 6px 22px rgba(124,58,237,.5)}
.sbtn-send:active{transform:scale(.94)}

/* MODAL */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:300;justify-content:flex-end;align-items:flex-end;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
}
.modal-bg.on{display:flex}
.modal-sh{
  width:100%;max-width:500px;margin:0 auto;padding:22px 18px 28px;
  border-radius:24px 24px 0 0;
  background:rgba(12,14,28,.97);
  border:1px solid rgba(255,255,255,.12);border-bottom:none;
  max-height:82vh;overflow-y:auto;
}
.msh-title{
  font-size:13px;font-weight:800;letter-spacing:2px;margin-bottom:16px;
  padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;gap:8px;
}
.msh-title.red{color:#f87171}
.msh-title.blue{color:#7dd3fc}
.msh-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.mb{
  padding:11px 10px;border-radius:12px;border:none;cursor:pointer;font-size:12px;font-weight:700;
  letter-spacing:.5px;transition:all .2s;text-align:center;font-family:inherit;
}
.mb-d{background:rgba(255,255,255,.07);color:rgba(255,255,255,.65)}
.mb-d:hover{background:rgba(255,255,255,.13);color:#fff}
.mb-r{background:rgba(239,68,68,.12);color:#fca5a5}
.mb-r:hover{background:rgba(239,68,68,.22)}
.mb-b{background:rgba(56,189,248,.1);color:#7dd3fc}
.mb-b:hover{background:rgba(56,189,248,.2)}
.mb-g{background:rgba(74,222,128,.1);color:#86efac}
.mb-g:hover{background:rgba(74,222,128,.2)}
.mb-v{background:rgba(167,139,250,.12);color:#c4b5fd}
.mb-v:hover{background:rgba(167,139,250,.22)}
.mb-full{grid-column:1/-1}
.mb-close{width:100%;padding:10px;border-radius:11px;border:none;cursor:pointer;background:rgba(255,255,255,.04);color:rgba(255,255,255,.3);font-size:13px;margin-top:4px;font-family:inherit}

/* TOAST */
#toast{
  position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(12px);z-index:999;
  background:rgba(18,22,42,.97);border:1px solid rgba(255,255,255,.14);
  padding:9px 18px;border-radius:12px;font-size:13px;color:#e2e8f0;
  opacity:0;transition:all .28s cubic-bezier(.4,0,.2,1);pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
  #sb{position:fixed;left:0;top:0;bottom:0;z-index:90;transform:translateX(-100%);box-shadow:8px 0 32px rgba(0,0,0,.5)}
  #sb.mob{transform:translateX(0)}
  #sb.off{display:flex;transform:translateX(-100%)}
  .msh-grid{grid-template-columns:1fr}
  .lcard{border-radius:20px;padding:28px 20px 22px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="ls" class="scr on">
<div class="lcard">
  <div class="logo-wrap">
    <div class="logo-icon">🔐</div>
    <div class="logo-title">WHOAMI SEC</div>
    <div class="logo-sub">ENCRYPTED CHANNEL</div>
  </div>

  <div class="av-wrap">
    <div class="av-label">AVATAR TANLANG</div>
    <div class="av-grid" id="avpick">
      <div class="av-item sel" data-v="🦊" onclick="pickAv(this)">🦊</div>
      <div class="av-item" data-v="🐺" onclick="pickAv(this)">🐺</div>
      <div class="av-item" data-v="🦅" onclick="pickAv(this)">🦅</div>
      <div class="av-item" data-v="🐉" onclick="pickAv(this)">🐉</div>
      <div class="av-item" data-v="🤖" onclick="pickAv(this)">🤖</div>
      <div class="av-item" data-v="👾" onclick="pickAv(this)">👾</div>
      <div class="av-item" data-v="🎭" onclick="pickAv(this)">🎭</div>
      <div class="av-item" data-v="🔮" onclick="pickAv(this)">🔮</div>
      <div class="av-item" data-v="🦁" onclick="pickAv(this)">🦁</div>
      <div class="av-item" data-v="🐍" onclick="pickAv(this)">🐍</div>
    </div>
  </div>

  <div class="fi">
    <input type="text" id="nin" placeholder="Taxallus (nik) kiriting..." maxlength="20" autocomplete="off" oninput="onNik(this.value)">
  </div>
  <p id="phint">🔑 Maxfiy kalit kiriting</p>
  <div class="fi" id="pbox" style="display:none">
    <input type="password" id="pin" placeholder="Parol..." maxlength="50">
    <span class="fi-ico">🔒</span>
  </div>
  <button class="btn-go" onclick="doLogin()">KIRISH ➤</button>
  <p class="lerr" id="lerr"></p>
</div>
</div>

<!-- APP -->
<div id="app">
  <div id="ann"></div>
  <div class="tbar">
    <div class="tbar-logo">WHOAMI</div>
    <div class="online-badge"><div class="odot"></div><span id="ocnt">0</span>&nbsp;onlayn</div>
    <div class="tbar-r">
      <button class="tbb" onclick="toggleSb()">☰</button>
      <button class="tbb tbb-adm" id="admb" style="display:none" onclick="openModal('adm-modal')">⚙ Admin</button>
      <button class="tbb tbb-hlp" id="hlpb" style="display:none" onclick="openModal('hlp-modal')">🛡 Helper</button>
    </div>
  </div>

  <div class="layout">
    <!-- SIDEBAR -->
    <div id="sb" class="off">
      <div class="sb-sec">
        <div class="sb-ttl">Onlayn foydalanuvchilar</div>
        <div id="ulist"></div>
      </div>
      <div class="sb-sec2">
        <div class="sb-ttl">Amallar</div>
        <button class="sbtn" onclick="doStealth()"><span style="font-size:15px">🎭</span>&nbsp;Niqob: <span id="stlbl">off</span></button>
        <button class="sbtn" onclick="doExport()"><span style="font-size:15px">💾</span>&nbsp;Chat eksport</button>
      </div>
    </div>

    <!-- CHAT WRAP -->
    <div class="cwrap">

      <!-- DM OVERLAY -->
      <div id="dmov">
        <div class="dm-tb">
          <div id="dmav" style="font-size:26px;width:40px;text-align:center;flex-shrink:0"></div>
          <div class="dm-info">
            <h3 id="dmttl">Shaxsiy chat</h3>
            <p>Xabarlar AES-256 bilan shifrlangan</p>
          </div>
          <button class="dm-close" onclick="closeDm()">✕ Yopish</button>
        </div>
        <div id="dmmsgs"></div>
        <div class="ibar">
          <textarea class="itxt" id="dmin" placeholder="Shaxsiy xabar..." rows="1" onkeypress="dmKey(event)" oninput="autoH(this)"></textarea>
          <button class="sbtn-send" onclick="sendDm()">➤</button>
        </div>
      </div>

      <div id="msgs"></div>
      <div id="tybar"></div>
      <div class="ibar">
        <textarea class="itxt" id="min" placeholder="Xabar yozing... (Enter — yuborish)" rows="1" onkeypress="msgKey(event)" oninput="autoH(this)"></textarea>
        <button class="sbtn-send" onclick="sendMsg()">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- ADMIN MODAL (faqat admin ko'radi) -->
<div id="adm-modal" class="modal-bg" onclick="bgClose(event,'adm-modal')">
<div class="modal-sh" onclick="event.stopPropagation()">
  <div class="msh-title red">⚙&nbsp;Admin Boshqaruvi</div>
  <div class="msh-grid">
    <button class="mb mb-d" onclick="sys('clear')">🗑 Log tozalash</button>
    <button class="mb mb-d" onclick="doLock()">🔒 Chat lock/unlock</button>
    <button class="mb mb-b" onclick="doAnnounce()">📢 E'lon joylash</button>
    <button class="mb mb-g" onclick="doExport();closeModal('adm-modal')">💾 Eksport qilish</button>
    <button class="mb mb-v" onclick="sys('theme','purple')">🟣 Binafsha tema</button>
    <button class="mb mb-b" onclick="sys('theme','teal')">🩵 Moviy-yashil tema</button>
    <button class="mb mb-d" onclick="sys('theme','blue')">🔵 Ko'k tema</button>
    <button class="mb mb-d" onclick="sys('theme','default')">⚫ Standart tema</button>
    <button class="mb mb-r mb-full" onclick="doKick()">🚨 Emergency — Barchani chiqarish</button>
  </div>
  <button class="mb-close" onclick="closeModal('adm-modal')">Yopish</button>
</div>
</div>

<!-- HELPER MODAL (faqat helper ko'radi) -->
<div id="hlp-modal" class="modal-bg" onclick="bgClose(event,'hlp-modal')">
<div class="modal-sh" onclick="event.stopPropagation()">
  <div class="msh-title blue">🛡&nbsp;Helper Vositalari</div>
  <div class="msh-grid">
    <button class="mb mb-d" onclick="sys('clear');closeModal('hlp-modal')">🗑 Log tozalash</button>
    <button class="mb mb-g" onclick="doExport();closeModal('hlp-modal')">💾 Eksport</button>
    <button class="mb mb-b" onclick="sys('theme','teal');closeModal('hlp-modal')">🩵 Moviy tema</button>
    <button class="mb mb-d" onclick="sys('theme','default');closeModal('hlp-modal')">⚫ Standart tema</button>
  </div>
  <button class="mb-close" onclick="closeModal('hlp-modal')">Yopish</button>
</div>
</div>

<div id="toast"></div>

<script>
const ABLY_KEY='7k7eJQ.wlzQCA:mT1OA_HGf29bZrs8s_kMJ2K39lR6UgNr1aOGks7ttds';
const EK='WHOAMI_SEC_V4_2026';

const ADMINS=[{n:'x-gab',p:'6969'}];
const HELPERS=[{n:'helper',p:'6996'}];

let myNick='',myRole='user',myAv='🦊';
let stealth=false,locked=false;
let typing=false,tTimer=null;
let hist=[],dmHist=[],dmTarget=null,dmTargetAv='';
let presList=[];

const ably=new Ably.Realtime(ABLY_KEY);
const mch=ably.channels.get('whoami-v4-main');
const sch=ably.channels.get('whoami-v4-sys');
const dch=ably.channels.get('whoami-v4-dm');
const pch=ably.channels.get('whoami-v4-pres');

const enc=t=>CryptoJS.AES.encrypt(t,EK).toString();
const dec=c=>{try{const b=CryptoJS.AES.decrypt(c,EK);return b.toString(CryptoJS.enc.Utf8)||null}catch{return null}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const ts=()=>new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});

function pickAv(el){
  document.querySelectorAll('.av-item').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');myAv=el.dataset.v;
}

function onNik(v){
  const vl=v.toLowerCase().trim();
  const sp=ADMINS.some(a=>a.n===vl)||HELPERS.some(h=>h.n===vl);
  document.getElementById('pbox').style.display=sp?'block':'none';
  document.getElementById('phint').style.display=sp?'block':'none';
}

function doLogin(){
  const nick=document.getElementById('nin').value.trim();
  const pass=document.getElementById('pin').value;
  const err=document.getElementById('lerr');
  if(!nick){err.textContent='Taxallus kiriting!';return}
  if(nick.length<2){err.textContent='Kamida 2 belgi!';return}
  if(/[<>"'&]/.test(nick)){err.textContent='Noto\'g\'ri belgilar!';return}
  const vl=nick.toLowerCase();
  myRole='user';
  const adm=ADMINS.find(a=>a.n===vl);
  const hlp=HELPERS.find(h=>h.n===vl);
  if(adm){if(pass!==adm.p){err.textContent='Noto\'g\'ri parol!';return}myRole='admin';}
  else if(hlp){if(pass!==hlp.p){err.textContent='Noto\'g\'ri parol!';return}myRole='helper';}
  myNick=nick;err.textContent='';
  startApp();
}

function startApp(){
  document.getElementById('ls').classList.remove('on');
  document.getElementById('app').classList.add('on');
  if(myRole==='admin')document.getElementById('admb').style.display='block';
  if(myRole==='helper')document.getElementById('hlpb').style.display='block';

  mch.subscribe('msg',m=>renderMsg(m.data));
  sch.subscribe('sys',m=>handleSys(m.data));
  dch.subscribe('dm',m=>handleDm(m.data));
  mch.subscribe('typ',m=>handleTyp(m.data));

  pch.presence.enter({nick:myNick,role:myRole,av:myAv});
  pch.presence.subscribe(()=>updatePres());
  updatePres();

  if(myRole!=='admin'){
    sch.publish('sys',{t:'join',nick:myNick,role:myRole,av:myAv});
  }
  syslog(`Xush kelibsiz, ${myNick}! Shifrlash faol.`,'w');
  document.getElementById('min').focus();
}

function renderMsg(d){
  if(!d||!d.nick)return;
  const t=dec(d.text);if(t===null)return;
  const own=d.nick===myNick&&!d.ghost;
  const rl=d.role;
  const nc=rl==='admin'?'na':rl==='helper'?'nh':'nu';
  const tc=rl==='admin'?'is-adm':rl==='helper'?'is-hlp':'';
  const dc=rl==='admin'?'rd-adm':rl==='helper'?'rd-hlp':'rd-usr';
  const badge=rl==='admin'?`<span class="mbadge ba">ADMIN</span><span class="admin-title">ROOT</span>`:rl==='helper'?`<span class="mbadge bh">HELPER</span>`:'';
  const box=document.getElementById('msgs');
  const el=document.createElement('div');
  el.className='msg'+(own?' own':'');
  el.innerHTML=`
    <div class="mav">${esc(d.av||'👤')}<div class="role-dot ${dc}"></div></div>
    <div class="mbody">
      <div class="mhead">
        <span class="mnick ${nc}">${esc(d.nick)}</span>${badge}
        <span class="mtime">${ts()}</span>
      </div>
      <div class="mtext ${tc}">${esc(t)}</div>
    </div>`;
  box.appendChild(el);box.scrollTop=box.scrollHeight;
  hist.push({nick:d.nick,role:rl,text:t,time:ts()});
}

function sendMsg(){
  const inp=document.getElementById('min');
  const v=inp.value.trim();
  if(!v)return;
  if(locked&&myRole!=='admin'){toast('Chat hozir bloklangan!');return}
  const g=stealth;
  const dn=g?'anon_'+Math.random().toString(36).slice(2,5):myNick;
  const dr=g?'user':myRole;
  const da=g?'🎭':myAv;
  mch.publish('msg',{nick:dn,av:da,role:dr,text:enc(v),ghost:g,ts:Date.now()});
  inp.value='';inp.style.height='';stopTyp();
}

function handleSys(d){
  if(!d)return;
  const t=d.t;
  if(t==='join')syslog(`${d.av||'👤'} ${d.nick} kirdi`,'j');
  else if(t==='leave')syslog(`${d.nick} chiqdi`,'l');
  else if(t==='clear'){document.getElementById('msgs').innerHTML='';syslog('Chat tozalandi','w')}
  else if(t==='lock'){locked=true;syslog('Chat bloklandi — faqat admin yoza oladi','w')}
  else if(t==='unlock'){locked=false;syslog('Chat bloki olib tashlandi','j')}
  else if(t==='announce'){const a=document.getElementById('ann');a.textContent='📢 '+d.txt;a.classList.add('on');setTimeout(()=>a.classList.remove('on'),9000)}
  else if(t==='theme')applyTheme(d.c);
  else if(t==='kick'){
    if(myRole!=='admin'){
      document.body.innerHTML=`<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:#080b14;color:#f87171;text-align:center;gap:16px;font-family:system-ui;padding:24px"><div style="font-size:40px">🚨</div><h2 style="letter-spacing:3px;font-size:18px">SESSION YAKUNLANDI</h2><p style="color:rgba(255,255,255,.35);font-size:13px;line-height:1.8">Tizimdan chiqarildingiz.<br>5 soniyadan keyin qayta yuklanadi.</p></div>`;
      setTimeout(()=>location.reload(),5000);
    }
  }
}

function handleDm(d){
  if(!d)return;
  if(d.to!==myNick&&d.from!==myNick)return;
  const t=dec(d.text);if(!t)return;
  dmHist.push({...d,dec:t});
  if(dmTarget&&(d.from===dmTarget||d.to===dmTarget)){
    renderDmMsg(d,t);
  } else if(d.from!==myNick){
    toast(`📩 ${d.from}: ${t.slice(0,28)}${t.length>28?'…':''}`);
  }
}

function openDm(tnick,tav){
  if(tnick===myNick)return;
  dmTarget=tnick;dmTargetAv=tav||'👤';
  document.getElementById('dmttl').textContent=tav+' '+tnick+' — shaxsiy chat';
  document.getElementById('dmav').textContent=tav||'👤';
  const box=document.getElementById('dmmsgs');
  box.innerHTML='';
  dmHist.filter(d=>(d.from===tnick&&d.to===myNick)||(d.from===myNick&&d.to===tnick))
    .forEach(d=>renderDmMsg(d,d.dec));
  document.getElementById('dmov').classList.add('on');
  document.getElementById('dmin').focus();
  if(window.innerWidth<=600)closeSbMob();
}

function renderDmMsg(d,t){
  if(!t)return;
  const own=d.from===myNick;
  const box=document.getElementById('dmmsgs');
  box.innerHTML+=`<div style="display:flex;flex-direction:${own?'row-reverse':'row'};gap:9px;margin-bottom:12px;animation:up .2s ease">
    <div style="font-size:20px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-start">${esc(d.av||'👤')}</div>
    <div>
      <div style="font-size:11px;color:rgba(255,255,255,.25);margin-bottom:4px;text-align:${own?'right':'left'}">${esc(d.from)}&nbsp;·&nbsp;${new Date(d.ts).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})}</div>
      <div style="font-size:13px;padding:9px 13px;border-radius:${own?'14px 4px 14px 14px':'4px 14px 14px 14px'};max-width:240px;background:${own?'rgba(124,58,237,.22)':'rgba(255,255,255,.07)'};border:1px solid ${own?'rgba(124,58,237,.3)':'rgba(255,255,255,.08)'};color:${own?'#e0d9ff':'rgba(255,255,255,.85)'};word-break:break-word">${esc(t)}</div>
    </div>
  </div>`;
  box.scrollTop=box.scrollHeight;
}

function sendDm(){
  const inp=document.getElementById('dmin');
  const v=inp.value.trim();
  if(!v||!dmTarget)return;
  dch.publish('dm',{from:myNick,to:dmTarget,av:myAv,text:enc(v),ts:Date.now()});
  inp.value='';inp.style.height='';
}

function closeDm(){document.getElementById('dmov').classList.remove('on');dmTarget=null}
function dmKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendDm()}}
function msgKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}}
function autoH(el){el.style.height='';el.style.height=Math.min(el.scrollHeight,110)+'px'}

function handleTyp(d){
  if(d.nick===myNick)return;
  const b=document.getElementById('tybar');
  b.textContent=d.on?d.nick+' yozmoqda...':'';
}
document.getElementById('min').addEventListener('input',()=>{
  if(!typing){typing=true;mch.publish('typ',{nick:myNick,on:true})}
  clearTimeout(tTimer);tTimer=setTimeout(stopTyp,2200);
});
function stopTyp(){typing=false;mch.publish('typ',{nick:myNick,on:false})}

function updatePres(){
  pch.presence.get((e,m)=>{
    if(e)return;presList=m;
    document.getElementById('ocnt').textContent=m.length;
    const ul=document.getElementById('ulist');
    ul.innerHTML=m.map(u=>{
      const r=u.data.role||'user';
      const a=u.data.av||'👤';
      const isMe=u.data.nick===myNick;
      const rtag=r==='admin'?'<span class="utag ta">ADMIN</span>':r==='helper'?'<span class="utag th">HELPER</span>':'<span class="utag tu">USER</span>';
      const dmhint=isMe?'':'<span class="dm-hint">DM ➤</span>';
      return `<div class="uitem ${isMe?'no-dm':''}" ${isMe?'':('onclick="openDm(\''+esc(u.data.nick)+'\',\''+a+'\')"')}>
        <div class="uav">${a}</div>
        <span class="uname">${esc(u.data.nick)}${isMe?' ·siz':''}</span>
        ${rtag}${dmhint}
      </div>`;
    }).join('');
  });
}
setInterval(updatePres,9000);

function syslog(txt,tp){
  const b=document.getElementById('msgs');
  const cl=tp==='j'?'sl-j':tp==='l'?'sl-l':'sl-w';
  b.innerHTML+=`<div class="syslog ${cl}">${txt}</div>`;
  b.scrollTop=b.scrollHeight;
}

function sys(t,c){
  sch.publish('sys',{t,c});
}

function toggleSb(){
  const s=document.getElementById('sb');
  if(window.innerWidth<=600){
    s.classList.remove('off');s.classList.toggle('mob');
  } else {
    s.classList.toggle('off');
  }
}
function closeSbMob(){document.getElementById('sb').classList.remove('mob')}

function doStealth(){
  stealth=!stealth;
  document.getElementById('stlbl').textContent=stealth?'on':'off';
  toast(stealth?'Niqob yoqildi — anonim rejim faol':'Niqob o\'chirildi');
}
function doExport(){
  if(!hist.length){toast('Eksport uchun xabar yo\'q');return}
  const t=hist.map(h=>`[${h.time}] ${h.nick} (${h.role}): ${h.text}`).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));
  a.download=`whoami-${Date.now()}.txt`;a.click();
  toast('Chat saqlandi!');
}
function doLock(){
  locked=!locked;sys(locked?'lock':'unlock');closeModal('adm-modal');
}
function doAnnounce(){
  const t=prompt('E\'lon matni:');
  if(t&&t.trim()){sch.publish('sys',{t:'announce',txt:t.trim()});closeModal('adm-modal')}
}
function doKick(){
  if(confirm('Haqiqatan barchani chiqarmoqchimisiz?')){sys('kick');closeModal('adm-modal')}
}
function applyTheme(c){
  const map={
    purple:'radial-gradient(ellipse 60% 50% at 15% 15%,rgba(139,92,246,.22) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 85% 85%,rgba(99,102,241,.18) 0%,transparent 60%)',
    teal:'radial-gradient(ellipse 60% 50% at 20% 20%,rgba(20,184,166,.2) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 80% 80%,rgba(6,182,212,.15) 0%,transparent 60%)',
    blue:'radial-gradient(ellipse 60% 50% at 15% 15%,rgba(59,130,246,.2) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 85% 85%,rgba(56,189,248,.14) 0%,transparent 60%)',
    default:'radial-gradient(ellipse 60% 50% at 15% 15%,rgba(99,102,241,.18) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 85% 85%,rgba(139,92,246,.14) 0%,transparent 60%)'
  };
  document.body.style.setProperty('--bg-extra',map[c]||map.default);
  document.querySelector('body::before');
  document.body.setAttribute('data-theme',c);
}

function openModal(id){document.getElementById(id).classList.add('on')}
function closeModal(id){document.getElementById(id).classList.remove('on')}
function bgClose(e,id){if(e.target===document.getElementById(id))closeModal(id)}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),3200);
}
</script>
</body>
</html>
